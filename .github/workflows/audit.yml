name: Audit dependencies

permissions:
  issues: write
  checks: write

on:
  schedule:
    # Run weekly Monday morning
    - cron: "49 4 * * 1"

  workflow_dispatch:

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # 2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Advisories reviewed and found not to affect sentry-cli.
          # Re-evaluate if the relevant dependency usage changes.
          # - RUSTSEC-2025-0119: number_prefix unmaintained (informational),
          #   pulled in by the intentionally pinned indicatif 0.14.
          # - RUSTSEC-2026-0253: lru use-after-free; requires `pop()` with a
          #   key whose drop panics. We only use `LruCache<String, ()>` and
          #   never call `pop()`.
          # - RUSTSEC-2026-0285, RUSTSEC-2026-0346, RUSTSEC-2026-0348,
          #   RUSTSEC-2026-0349: rustls; only an optional dependency of
          #   reqwest in Cargo.lock, never compiled (we use native-tls).
          # - RUSTSEC-2026-0367, RUSTSEC-2026-0368, RUSTSEC-2026-0369,
          #   RUSTSEC-2026-0429: zip; only affect the `extract()` APIs, which
          #   we don't use.
          # - RUSTSEC-2026-0545, RUSTSEC-2026-0546, RUSTSEC-2026-0547,
          #   RUSTSEC-2026-0548: zip; we never decrypt AES entries, call the
          #   `extract()` APIs, enable `legacy-zip`, or use `ZipStreamReader`.
          #   zip 7.x is pinned by symbolic-debuginfo.
          # - RUSTSEC-2026-0542, RUSTSEC-2026-0543, RUSTSEC-2026-0555,
          #   RUSTSEC-2026-0559: humantime, chrono, chrono-tz, chrono-tz-build
          #   unmaintained (informational); no known vulnerability.
          ignore: |
            RUSTSEC-2025-0119,
            RUSTSEC-2026-0253,
            RUSTSEC-2026-0285,
            RUSTSEC-2026-0346,
            RUSTSEC-2026-0348,
            RUSTSEC-2026-0349,
            RUSTSEC-2026-0367,
            RUSTSEC-2026-0368,
            RUSTSEC-2026-0369,
            RUSTSEC-2026-0429,
            RUSTSEC-2026-0542,
            RUSTSEC-2026-0543,
            RUSTSEC-2026-0545,
            RUSTSEC-2026-0546,
            RUSTSEC-2026-0547,
            RUSTSEC-2026-0548,
            RUSTSEC-2026-0555,
            RUSTSEC-2026-0559
