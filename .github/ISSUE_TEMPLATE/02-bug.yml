name: 🐞 Bug Report
description: Report a bug in the legacy Sentry CLI
labels: ["CLI", "Bug"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > This legacy `sentry-cli` is no longer under active development. Before filing an issue here, please try the [new Sentry CLI](https://cli.sentry.dev/). Report problems with the new CLI in the [new CLI repository](https://github.com/getsentry/cli/issues/new).

        We only accept bug reports for the legacy CLI in exceptional cases:

        - A fundamental blocker prevents you from migrating to the new CLI.
        - A recent legacy CLI release introduced a serious regression.

  - type: textarea
    id: exceptional-reason
    attributes:
      label: Why should this be addressed in the legacy CLI?
      description: Explain which exceptional case applies and why. If migration is blocked, describe the fundamental blocker. If this is a serious regression, identify the recent legacy CLI release that introduced it.
      placeholder: Tell us why this problem needs to be fixed in the legacy CLI rather than addressed by migrating to the new CLI.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        To help us understand and resolve your issue, please provide the following information:

        ## Environment
  - type: input
    id: cli-version
    attributes:
      label: CLI Version
      description: In which version(s) of the CLI did you encounter the issue?
    validations:
      required: true
  - type: checkboxes
    id: os
    attributes:
      label: Operating System and Architecture
      description: On which operating system(s) and architecture(s) did you encounter the issue? Please select all that apply.
      options:
        - label: macOS (arm64)
        - label: macOS (x86_64)
        - label: Linux (i686)
        - label: Linux (x86_64)
        - label: Linux (armv7)
        - label: Linux (aarch64)
        - label: Windows (i686)
        - label: Windows (x86_64)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating System Version
      description: Which version of the operating system are you using?
      placeholder: e.g. macOS 14.0.0, Ubuntu 20.04, or Windows 10
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Reproduction Steps
  - type: input
    attributes:
      label: Link to reproduction repository
      description: Please link to a repository that demonstrates the issue, if possible. Providing this information will help us help you faster!
  - type: input
    attributes:
      label: CLI Command
      description: What command did you run when you encountered the issue? (if applicable)
      placeholder: sentry-cli <command> [options] --log-level=debug
  - type: textarea
    attributes:
      label: Exact Reproduction Steps
      description: What are the **exact** steps you took to encounter the issue?
      placeholder: |
        For example:
          1. Clone the repository provided above
          2. Launch a terminal window inside the repository
          3. Install the dependencies with `npm install`
          4. Run the command provided above
        Help us help you! Please be as specific as possible.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Results
  - type: textarea
    attributes:
      label: Expected Results
      description: What did you expect would happen when you ran the command?
      placeholder: e.g. I expected the CLI to upload the source maps to Sentry and display a success message.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual Results
      description: What actually happened when you ran the command?
      placeholder: e.g. The CLI displayed an error message and exited with a non-zero status code.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: |
        Please provide the full log output from the CLI. If possible, run the CLI with `--log-level=debug`.
        **Remember to remove any sensitive information!**
    validations:
      required: true
  - type: markdown
    attributes:
      value: |-
        ## Thanks 🙏
        Check our [triage docs](https://open.sentry.io/triage/) for what to expect next.
